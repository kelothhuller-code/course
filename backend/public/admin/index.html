<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIDETECHNOS - Super Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>WIDETECHNOS</h2>
                <span class="badge">Super Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item" data-view="courses">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Courses & Content
                </a>
                <a href="#" class="nav-item" data-view="students">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Students
                </a>
                <a href="#" class="nav-item" data-view="referrals">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Referrals & Affiliates
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb" id="breadcrumb">Dashboard</div>
                <div class="user-profile">
                    <span class="user-name">Admin User</span>
                    <div class="avatar">A</div>
                </div>
            </header>
            <div class="view-container" id="view-container">
                <div class="loading">Loading...</div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/admin/js/utils/helpers.js"></script>
    <script src="/admin/js/utils/renderers.js"></script>
    <script src="/admin/js/modules/api.js"></script>
    <script src="/admin/js/modules/auth.js"></script>
    <script src="/admin/js/modules/dashboard.js"></script>
    <script src="/admin/js/modules/courses.js"></script>
    <script src="/admin/js/modules/students.js"></script>
    <script src="/admin/js/modules/referrals.js"></script>
    <script src="/admin/js/modules/comments.js"></script>
    <script src="/admin/js/app.js"></script>
</body>
</html>
