# ==============================================================================
# WIDETECH Production Nginx Configuration
# Domain: widetech.in / www.widetech.in
# Admin Portal: /wide-hq-portal (legacy /wide-admin-portal kept)
# Software installers: up to 2 GB uploads on /api/admin/software/ + /api/upload/,
#   unbuffered streamed downloads on /api/software/ (docs/SOFTWARE_DOWNLOADS.md)
# Backend Service: Node.js (PM2) on 127.0.0.1:5001
# Frontend Build: Vite Static SPA at /var/www/course/frontend/dist
#
# Speed notes (see docs/PERFORMANCE.md for how to apply this on the server):
#   - gzip for every text type (JS/CSS/JSON/SVG/fonts); brotli optional (commented below)
#   - hashed /assets/* cached for 1 year (immutable); index.html never cached
#   - /uploads (course images) cached 7 days, served via the backend
#   - "^~" on /api/ and /uploads/ so the static-file regex below can't hijack them
#     (e.g. /uploads/thumbnails/x.png would otherwise 404 from the dist folder)
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name widetech.in www.widetech.in;

    # Allow Let's Encrypt / Certbot renewal ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # nginx >= 1.25.1 prefers this form instead of "http2" on the listen lines:
    # http2 on;
    server_name widetech.in www.widetech.in;

    # SSL Certificate Paths (Certbot standard)
    ssl_certificate /etc/letsencrypt/live/widetech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widetech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload payload size for normal uploads (matches the backend 100MB limit).
    # Software installers use the larger limit in the /api/admin/software/ and /api/upload/
    # blocks below (backend: SOFTWARE_MAX_UPLOAD_MB, default 2048). See docs/SOFTWARE_DOWNLOADS.md.
    client_max_body_size 100M;

    # Compression (the biggest single win for visitors in India: ~70% fewer bytes)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json application/ld+json
        application/manifest+json application/rss+xml application/atom+xml application/xml
        image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # Optional: Brotli (~15% smaller than gzip). Needs the brotli module:
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # then uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript
    #              application/json application/ld+json application/manifest+json
    #              application/xml image/svg+xml image/x-icon font/ttf font/otf;

    # --------------------------------------------------------------------------
    # Bot / Crawler Protection: Block common probe paths with 404
    # --------------------------------------------------------------------------
    location ~* ^/(admin|administrator|wp-admin|wp-login\.php|phpmyadmin) {
        return 404;
    }

    # --------------------------------------------------------------------------
    # Secret Admin Portal: Reverse Proxy to Express Backend
    # URL: https://widetech.in/wide-admin-portal/
    # --------------------------------------------------------------------------
    location /wide-admin-portal {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Admin Portal (current URL): https://widetech.in/wide-hq-portal/
    # --------------------------------------------------------------------------
    location ^~ /wide-hq-portal {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Software installer uploads (admin only, up to 2 GB). Streamed straight to the
    # backend (no nginx temp file), with long timeouts for slow uplinks.
    # Keep client_max_body_size in step with SOFTWARE_MAX_UPLOAD_MB.
    # --------------------------------------------------------------------------
    location ^~ /api/admin/software/ {
        client_max_body_size 2048M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5001/api/admin/software/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        client_body_timeout 600s;
    }

    location ^~ /api/upload/ {
        client_max_body_size 2048M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5001/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        client_body_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # Software catalogue + installer downloads: stream big files to the visitor
    # without buffering them in nginx, with long timeouts for slow connections.
    # --------------------------------------------------------------------------
    location ^~ /api/software/ {
        proxy_pass http://127.0.0.1:5001/api/software/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # Backend REST API & Webhooks
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # Static Uploads / Thumbnails Proxy
    # --------------------------------------------------------------------------
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend already sends "Cache-Control: public, max-age=604800" for thumbnails;
        # private files (materials, software) keep the backend's own headers.
    }

    # --------------------------------------------------------------------------
    # Frontend SPA (Single Page Application)
    # --------------------------------------------------------------------------
    root /var/www/course/frontend/dist;
    index index.html;

    # Vite build output: file names contain a content hash, so they never change -> cache forever
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts (stable file names, rarely change)
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Other public files (logo, icons, og-image, manifest): not hashed, so cache 1 day only
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|avif|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so visitors get new deploys straight away
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single Page Application fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
