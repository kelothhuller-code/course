# ==============================================================================
# WIDETECH Production Nginx Configuration
# Domain: widetech.in / www.widetech.in
# Admin Portal: /wide-admin-portal
# Backend Service: Node.js (PM2) on 127.0.0.1:5001
# Frontend Build: Vite Static SPA at /var/www/course/frontend/dist
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name widetech.in www.widetech.in;

    # Allow Let's Encrypt / Certbot renewal ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name widetech.in www.widetech.in;

    # SSL Certificate Paths (Certbot standard)
    ssl_certificate /etc/letsencrypt/live/widetech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widetech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload payload size (matches backend 100MB limit)
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Bot / Crawler Protection: Block common probe paths with 404
    # --------------------------------------------------------------------------
    location ~* ^/(admin|administrator|wp-admin|wp-login\.php|phpmyadmin) {
        return 404;
    }

    # --------------------------------------------------------------------------
    # Secret Admin Portal: Reverse Proxy to Express Backend
    # URL: https://widetech.in/wide-admin-portal/
    # --------------------------------------------------------------------------
    location /wide-admin-portal {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Backend REST API & Webhooks
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # Static Uploads / Thumbnails Proxy
    # --------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --------------------------------------------------------------------------
    # Frontend SPA (Single Page Application)
    # --------------------------------------------------------------------------
    root /var/www/course/frontend/dist;
    index index.html;

    # Static assets with cache busting hashes
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single Page Application fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
