<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WideTech | Courses, Software &amp; Business Services</title>
  <meta name="description" content="Practical online courses, ready-to-use business software and done-for-you services: automation, custom software and business administration. Secure checkout, real replies by email." />
  <meta name="author" content="WideTech" />
  <meta name="theme-color" content="#4338ca" />
  <link rel="canonical" href="https://widetech.in/" />

  <!-- Icons & app manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Self-hosted fonts (Outfit for headings, Plus Jakarta Sans for text), preloaded to avoid layout shift -->
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Open Graph / WhatsApp / Facebook / LinkedIn previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WideTech" />
  <meta property="og:url" content="https://widetech.in/" />
  <meta property="og:title" content="WideTech | Courses, Software &amp; Business Services" />
  <meta property="og:description" content="Learn new skills and run your business smarter: practical online courses, business software and done-for-you services." />
  <meta property="og:image" content="https://widetech.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="WideTech: courses, software and services" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WideTech | Courses, Software &amp; Business Services" />
  <meta name="twitter:description" content="Learn new skills and run your business smarter: practical online courses, business software and done-for-you services." />
  <meta name="twitter:image" content="https://widetech.in/og-image.png" />

  <!-- Organization structured data (real details from the Contact page) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "WideTech",
    "legalName": "WIDE VENTURES",
    "url": "https://widetech.in",
    "logo": "https://widetech.in/icons/icon-512.png",
    "email": "support@widetech.in",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "8/7/a, Thettamala, Mananthavady Road",
      "addressLocality": "Wayanad",
      "addressRegion": "Kerala",
      "postalCode": "670731",
      "addressCountry": "IN"
    },
    "sameAs": ["https://www.instagram.com/broffydiaries/"]
  }
  </script>
  <!-- Instant loading shell: painted from this HTML alone, before any JS/CSS downloads.
       React replaces everything inside #root when the app starts. Keep it tiny. -->
  <style>
    html { background: #f7f8fb; }
    body { margin: 0; }
    .boot { min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0b1220; }
    .boot-bar { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .boot-logo { width: 32px; height: 32px; }
    .boot-name { font-weight: 800; letter-spacing: .08em; font-size: 15px; }
    .boot-hero { max-width: 1120px; margin: 0 auto; padding: 56px 20px; }
    .boot-line { height: 14px; border-radius: 7px; background: #e8eaf3; margin: 14px 0; }
    .boot-title { height: 34px; width: min(560px, 90%); background: #dfe1f5; }
    .boot-title2 { height: 34px; width: min(420px, 70%); background: #dfe1f5; }
    .boot-btn { display: inline-block; width: 160px; height: 46px; margin-top: 22px; border-radius: 12px; background: #4338ca; }
    @media (prefers-reduced-motion: no-preference) {
      .boot-line { animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .55; } }
    }
  </style>
</head>

<body>
  <noscript>WideTech needs JavaScript to run. Email support@widetech.in if you need help.</noscript>
  <div id="root">
    <div class="boot" aria-busy="true" aria-label="Loading WideTech">
      <div class="boot-bar"><img class="boot-logo" src="/logo.svg" alt="" width="32" height="32" /><span class="boot-name">WIDETECH</span></div>
      <div class="boot-hero">
        <div class="boot-line boot-title"></div>
        <div class="boot-line boot-title2"></div>
        <div class="boot-line" style="width:min(640px,95%)"></div>
        <div class="boot-line" style="width:min(520px,80%)"></div>
        <span class="boot-btn"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
