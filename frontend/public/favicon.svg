<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="wtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wtAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="#0b0f19"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="2"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- Top-Left Horizontal Bar -->
    <path d="M 68 126 C 68 126 100 138 120 178 L 268 178 L 290 126 L 68 126 Z" fill="url(#wtGrad)"/>

    <!-- Left Wing -->
    <path d="M 106 230 L 164 230 L 224 374 L 180 436 C 168 440 152 436 142 422 L 106 230 Z" fill="url(#wtGrad)"/>

    <!-- Center Diagonal Band (Connecting to Top Right) -->
    <path d="M 198 436 L 334 178 L 452 178 C 468 178 464 196 450 216 L 366 384 C 354 416 332 436 302 436 L 198 436 Z" fill="url(#wtAccent)"/>

    <!-- Right Vertical Wing -->
    <path d="M 374 230 L 436 230 L 368 436 L 310 436 L 374 230 Z" fill="url(#wtGrad)"/>
  </g>
</svg>